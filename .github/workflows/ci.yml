name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The secret scanner reads `git ls-files`, so it needs the tree, not
          # a shallow slice of it. (History depth is irrelevant: this job checks
          # what the PR *contains*, and a secret already in history is a
          # different, unrecoverable problem — AGENTS.md rule 0.)
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: uv sync --locked

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run mypy

      - name: Tests
        run: uv run pytest

      # Last, and as its own step, so a failure here is unmistakable in the run
      # list rather than buried in a combined "checks" log.
      - name: No secrets
        run: ./scripts/check-no-secrets.sh

  # Its own job rather than more steps on `check`: the two halves need different
  # toolchains and neither should be able to mask the other in the run list.
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned rather than tracking `stable`, for the same reason the Python
          # side runs `uv sync --locked`: a toolchain that moves on its own turns
          # an unrelated PR red and teaches everyone to re-run the job.
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test
