# The localization seam, wired the way Flutter wires it rather than by hand.
#
# `AGENTS.md` requires user-facing strings to go through the UI layer's own i18n
# and never to be hard-coded. This file is what makes that mechanical: strings
# live in `lib/l10n/*.arb`, `flutter gen-l10n` compiles them, and a string typed
# into a widget is a string with no key — visible in review rather than merely
# discouraged.
#
# `output-dir` puts the generated code in the tree at `lib/l10n/generated/`,
# where it can be read and reviewed, rather than in a synthetic package only the
# build sees. It is committed for the same reason: a reviewer should be able to
# see the strings the app actually ships.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-dir: lib/l10n/generated
nullable-getter: false
