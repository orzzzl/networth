[project]
name = "networth"
version = "0.0.0"
description = "Personal net-worth aggregator — sync daemon and CLI"
requires-python = ">=3.12"
dependencies = [
    "plaid-python>=43.0.0",
    "urllib3>=2.7.0",
]

[project.scripts]
networth = "networth.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
    "mypy>=1.18",
]
# Not used by this project's own build (hatchling, resolved by uv from the lock).
# This group exists so that the *sandbox rehearsal runner* can pin the backend that
# builds `plaid-python`, which ships an sdist and no wheel: without it, installing
# the locked runtime on the host still fetches an unpinned setuptools inside pip's
# build isolation, and "the reviewed commit" would be executing bytes nobody pinned.
# See `scripts/sandbox-rehearsal.sh` and task 06.
build = [
    "setuptools>=80",
    "wheel>=0.45",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["networth"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["networth", "tests"]

# The official Plaid SDK (DESIGN.md section 16) ships no `py.typed`, so strict
# mode cannot see into it. Narrowed to that one package rather than relaxed
# globally: our own code stays strict, and the untyped surface is confined to
# `networth/plaid/client.py`, which is why that module converts every SDK value
# into our own types before returning it.
[[tool.mypy.overrides]]
module = ["plaid.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
