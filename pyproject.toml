[project]
name = "networth"
version = "0.0.0"
description = "Personal net-worth aggregator — sync daemon and CLI"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
networth = "networth.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
    "mypy>=1.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["networth"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["networth", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
